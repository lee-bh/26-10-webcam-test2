<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아이유 — 밤편지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    :root {
      --bg: #141413;
      --surface: #1d1d1b;
      --border: #2a2a27;
      --text-1: #f5f4f0;
      --text-2: #a1a09a;
      --text-3: #6b6a65;
      --font-sans: 'Instrument Sans', 'IBM Plex Sans KR', -apple-system, sans-serif;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text-1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ── Hidden YouTube Player (Audio Only Mode) ── */
    .hidden-player {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* ── Main Audio Widget ── */
    .player-widget {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 28px;
      max-width: 360px;
      width: 100%;
    }

    .track-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .artist-tag {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .track-title {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-1);
    }

    /* ── Single Big Play Button ── */
    .play-btn-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Subtle pulse ring when playing */
    .pulse-ring {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 1px solid rgba(245, 244, 240, 0.15);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .pulse-ring.active {
      opacity: 1;
      animation: pulse 2.4s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.25);
        opacity: 0.1;
      }
      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }

    button.play-button {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--text-1);
      color: var(--bg);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s, box-shadow 0.2s;
    }

    button.play-button:hover {
      transform: scale(1.06);
      background: #ffffff;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }

    button.play-button:active {
      transform: scale(0.96);
    }

    button.play-button svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
      transition: transform 0.15s;
    }

    /* Status Text */
    .status-text {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-3);
      letter-spacing: 0.02em;
      transition: color 0.3s;
    }

    .status-text.playing {
      color: var(--text-2);
    }
  </style>
</head>
<body>

  <!-- Hidden YouTube IFrame Player (Audio Only) -->
  <div class="hidden-player">
    <div id="player"></div>
  </div>

  <!-- Minimal Audio Player View -->
  <div class="player-widget">
    <div class="track-meta">
      <span class="artist-tag">아이유 (IU)</span>
      <h1 class="track-title">밤편지</h1>
    </div>

    <!-- Play Button with subtle pulse -->
    <div class="play-btn-wrapper">
      <div class="pulse-ring" id="pulse-ring"></div>
      <button class="play-button" id="play-btn" title="재생">
        <svg id="play-icon" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>
    </div>

    <!-- Simple Status Indicator -->
    <div class="status-text" id="status-text">재생하려면 클릭하세요</div>
  </div>

  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let isReady = false;

    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const statusText = document.getElementById('status-text');
    const pulseRing = document.getElementById('pulse-ring');

    const playSvg = '<path d="M8 5v14l11-7z"/>';
    const pauseSvg = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

    window.onYouTubeIframeAPIReady = function() {
      player = new YT.Player('player', {
        height: '200',
        width: '200',
        videoId: 'sBAv1wx4ghE',
        playerVars: {
          autoplay: 0,
          playsinline: 1,
          rel: 0,
          modestbranding: 1
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    };

    function onPlayerReady(event) {
      isReady = true;
      statusText.textContent = '재생 준비 완료';
    }

    function onPlayerError(event) {
      statusText.textContent = '재생 준비 중';
      if (player && typeof player.cueVideoById === 'function') {
        player.cueVideoById('sBAv1wx4ghE');
      }
    }

    function onPlayerStateChange(event) {
      switch (event.data) {
        case YT.PlayerState.PLAYING:
          playIcon.innerHTML = pauseSvg;
          playIcon.style.transform = 'translateX(0)';
          statusText.textContent = '재생 중';
          statusText.classList.add('playing');
          pulseRing.classList.add('active');
          break;

        case YT.PlayerState.PAUSED:
          playIcon.innerHTML = playSvg;
          playIcon.style.transform = 'translateX(2px)';
          statusText.textContent = '일시 정지';
          statusText.classList.remove('playing');
          pulseRing.classList.remove('active');
          break;

        case YT.PlayerState.BUFFERING:
          statusText.textContent = '버퍼링 중…';
          break;

        case YT.PlayerState.ENDED:
          playIcon.innerHTML = playSvg;
          playIcon.style.transform = 'translateX(2px)';
          statusText.textContent = '재생 완료';
          statusText.classList.remove('playing');
          pulseRing.classList.remove('active');
          break;

        default:
          playIcon.innerHTML = playSvg;
          break;
      }
    }

    // Play/Pause Button Click
    playBtn.addEventListener('click', () => {
      if (!player) return;

      const state = typeof player.getPlayerState === 'function' ? player.getPlayerState() : -1;

      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });
  </script>
</body>
</html>
