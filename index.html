<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="현재 위치 기반 실시간 날씨 정보" />
  <title>날씨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f6f4f0;
      --surface: #ffffff;
      --border: #e8e5df;
      --text-1: #1a1a18;
      --text-2: #6b6963;
      --text-3: #9e9a92;
      --accent: #2563eb;
      --radius: 8px;
      --font-sans: 'Instrument Sans', 'IBM Plex Sans KR', -apple-system, sans-serif;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ── */
    .page {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* ── Loading & Error ── */
    .state-msg {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
    }

    .state-msg p {
      color: var(--text-2);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .loader {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--text-1);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .retry-btn {
      margin-top: 4px;
      padding: 8px 20px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text-1);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .retry-btn:hover {
      border-color: var(--text-3);
    }

    /* ── Header ── */
    .header {
      margin-bottom: 40px;
    }

    .header-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .header-location {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-2);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .header-time {
      font-size: 0.75rem;
      color: var(--text-3);
    }

    /* ── Current Weather ── */
    .current {
      margin-bottom: 48px;
    }

    .current-main {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 12px;
    }

    .current-icon {
      flex-shrink: 0;
      width: 64px;
      height: 64px;
      margin-top: 4px;
    }

    .current-icon svg {
      width: 100%;
      height: 100%;
      color: var(--text-1);
    }

    .current-temp {
      font-size: 4.5rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -3px;
      font-variant-numeric: tabular-nums;
    }

    .current-temp span {
      font-size: 2rem;
      font-weight: 400;
      color: var(--text-3);
      letter-spacing: 0;
    }

    .current-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--text-2);
      line-height: 1.6;
    }

    .current-meta .sep {
      color: var(--border);
    }

    /* ── Detail Row ── */
    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 48px;
    }

    .detail-item {
      padding: 20px 0;
      text-align: center;
    }

    .detail-item:not(:last-child) {
      border-right: 1px solid var(--border);
    }

    .detail-item .d-label {
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
      margin-bottom: 6px;
    }

    .detail-item .d-value {
      font-size: 1rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* ── Section Labels ── */
    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-3);
      margin-bottom: 16px;
    }

    /* ── Hourly ── */
    .hourly {
      margin-bottom: 48px;
    }

    .hourly-track {
      display: flex;
      gap: 0;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      margin: 0 -24px;
      padding: 0 24px;
    }

    .hourly-track::-webkit-scrollbar {
      display: none;
    }

    .h-item {
      flex: 0 0 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
    }

    .h-item .h-time {
      font-size: 0.7rem;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    .h-item .h-icon {
      width: 24px;
      height: 24px;
      color: var(--text-2);
    }

    .h-item .h-icon svg {
      width: 100%;
      height: 100%;
    }

    .h-item .h-temp {
      font-size: 0.85rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .h-item.h-now .h-time {
      color: var(--text-1);
      font-weight: 600;
    }

    .h-item.h-now .h-temp {
      color: var(--accent);
    }

    /* ── Daily ── */
    .daily {
      margin-bottom: 48px;
    }

    .d-row {
      display: grid;
      grid-template-columns: 72px 28px 1fr;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
    }

    .d-row:last-child {
      border-bottom: none;
    }

    .d-row .d-day {
      font-weight: 500;
    }

    .d-row .d-day-icon {
      width: 22px;
      height: 22px;
      color: var(--text-2);
    }

    .d-row .d-day-icon svg {
      width: 100%;
      height: 100%;
    }

    .d-row .d-range {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
      font-variant-numeric: tabular-nums;
    }

    .d-range .lo {
      color: var(--text-3);
    }

    .d-range .bar {
      flex: 1;
      max-width: 100px;
      height: 3px;
      border-radius: 2px;
      background: var(--border);
      position: relative;
      overflow: hidden;
    }

    .d-range .bar-fill {
      position: absolute;
      height: 100%;
      border-radius: 2px;
      background: var(--text-2);
    }

    .d-range .hi {
      font-weight: 600;
    }

    /* ── Map ── */
    .map-section {
      margin-bottom: 48px;
    }

    .map-container {
      width: 100%;
      height: 250px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      background: var(--surface);
      position: relative;
      z-index: 1;
    }

    .custom-pin {
      background: transparent;
      border: none;
    }

    .map-marker {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #111827;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      position: relative;
    }

    .map-marker::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.2);
      animation: map-pulse 2s ease-out infinite;
    }

    @keyframes map-pulse {
      0% {
        transform: scale(0.8);
        opacity: 1;
      }

      100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    .leaflet-control-attribution {
      font-size: 0.65rem !important;
      background: rgba(255, 255, 255, 0.85) !important;
      color: var(--text-3) !important;
      padding: 2px 6px !important;
    }

    .leaflet-control-zoom {
      border: 1px solid var(--border) !important;
      box-shadow: none !important;
      border-radius: 6px !important;
      overflow: hidden;
    }

    .leaflet-control-zoom a {
      background-color: var(--surface) !important;
      color: var(--text-1) !important;
      border-bottom: 1px solid var(--border) !important;
    }

    /* ── Footer ── */
    .foot {
      font-size: 0.7rem;
      color: var(--text-3);
      text-align: center;
      margin-top: 8px;
    }

    .foot a {
      color: var(--text-2);
      text-decoration: none;
    }

    .foot a:hover {
      text-decoration: underline;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .page {
        padding: 32px 16px 60px;
      }

      .current-temp {
        font-size: 3.5rem;
      }

      .current-icon {
        width: 48px;
        height: 48px;
      }

      .details {
        grid-template-columns: repeat(2, 1fr);
      }

      .detail-item:nth-child(3) {
        border-right: none;
      }

      .detail-item:nth-child(odd):nth-child(n+3) {
        border-right: 1px solid var(--border);
      }

      .hourly-track {
        margin: 0 -16px;
        padding: 0 16px;
      }
    }
  </style>
</head>

<body>

  <div id="loading" class="state-msg">
    <div class="loader"></div>
    <p>위치를 확인하고 있습니다</p>
  </div>

  <div id="error" class="state-msg" style="display:none;">
    <p id="error-msg">오류가 발생했습니다.</p>
    <button class="retry-btn" onclick="init()">다시 시도</button>
  </div>

  <div class="page" id="weather" style="display:none;">

    <div class="header">
      <div class="header-top">
        <span class="header-location" id="loc">—</span>
        <span class="header-time" id="time">—</span>
      </div>
    </div>

    <div class="current">
      <div class="current-main">
        <div class="current-icon" id="cur-icon"></div>
        <div class="current-temp" id="cur-temp">—<span>°</span></div>
      </div>
      <div class="current-meta" id="cur-meta"></div>
    </div>

    <div class="details" id="detail-grid"></div>

    <div class="hourly">
      <p class="section-label">오늘</p>
      <div class="hourly-track" id="hourly"></div>
    </div>

    <div class="daily">
      <p class="section-label">이번 주</p>
      <div id="daily"></div>
    </div>

    <div class="map-section">
      <p class="section-label">위치</p>
      <div id="map" class="map-container"></div>
    </div>

    <p class="foot">
      <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> ·
      <span id="updated">—</span> 업데이트
    </p>
  </div>

  <script>
    /* ═══════════ SVG Icons (inline, no emoji) ═══════════ */
    const SVG = {
      sun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>`,

      moon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`,

      cloud: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>`,

      cloud_sun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 2v2m-6.36.64 1.42 1.42M2 12h2m2.64 6.36 1.42-1.42"/><circle cx="12" cy="10" r="4"/><path d="M18 14h-1.26A6 6 0 0 0 7 16.74 4 4 0 1 0 8 24h10a4 4 0 0 0 0-8z" transform="translate(0,-4) scale(0.85)" /></svg>`,

      rain: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M16 13V6a4 4 0 0 0-8 0"/><path d="M18 8h-1.26A8 8 0 1 0 9 16h9a5 5 0 0 0 0-10z" transform="translate(0,-2)"/><path d="M8 19v2m4-1v2m4-3v2"/></svg>`,

      drizzle: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 8h-1.26A8 8 0 1 0 9 16h9a5 5 0 0 0 0-10z" transform="translate(0,-2)"/><path d="M10 19v1m4-2v1"/></svg>`,

      snow: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 8h-1.26A8 8 0 1 0 9 16h9a5 5 0 0 0 0-10z" transform="translate(0,-3)"/><path d="M8 18l1 2m2-3l1 2m2-3l1 2" stroke-dasharray="2 2"/></svg>`,

      thunder: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 8h-1.26A8 8 0 1 0 9 16h9a5 5 0 0 0 0-10z" transform="translate(0,-3)"/><polyline points="13 16 11 20 14 20 12 24"/></svg>`,

      fog: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 12h16M4 16h12M4 20h16M4 8h8"/></svg>`,

      unknown: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9 9a3 3 0 1 1 2.83 4H12v1m0 4h.01"/></svg>`,
    };

    /* ═══════════ WMO → icon key + korean name ═══════════ */
    const WMO = {
      0: { key: 'sun', name: '맑음' },
      1: { key: 'cloud_sun', name: '대체로 맑음' },
      2: { key: 'cloud_sun', name: '부분 흐림' },
      3: { key: 'cloud', name: '흐림' },
      45: { key: 'fog', name: '안개' },
      48: { key: 'fog', name: '서리 안개' },
      51: { key: 'drizzle', name: '이슬비' },
      53: { key: 'drizzle', name: '이슬비' },
      55: { key: 'drizzle', name: '이슬비' },
      56: { key: 'rain', name: '결빙 이슬비' },
      57: { key: 'rain', name: '결빙 이슬비' },
      61: { key: 'rain', name: '비' },
      63: { key: 'rain', name: '비' },
      65: { key: 'rain', name: '강한 비' },
      66: { key: 'rain', name: '결빙 비' },
      67: { key: 'rain', name: '결빙 비' },
      71: { key: 'snow', name: '눈' },
      73: { key: 'snow', name: '눈' },
      75: { key: 'snow', name: '폭설' },
      77: { key: 'snow', name: '싸락눈' },
      80: { key: 'rain', name: '소나기' },
      81: { key: 'rain', name: '소나기' },
      82: { key: 'rain', name: '강한 소나기' },
      85: { key: 'snow', name: '눈 소나기' },
      86: { key: 'snow', name: '눈 소나기' },
      95: { key: 'thunder', name: '뇌우' },
      96: { key: 'thunder', name: '뇌우·우박' },
      99: { key: 'thunder', name: '뇌우·우박' },
    };

    function wmo(code) { return WMO[code] || { key: 'unknown', name: '—' }; }

    function weatherSVG(code, hour) {
      const isNight = hour < 6 || hour >= 19;
      const w = wmo(code);
      if (isNight && (code <= 1)) return SVG.moon;
      return SVG[w.key] || SVG.unknown;
    }

    /* ═══════════ Helpers ═══════════ */
    function windDir(deg) {
      const d = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
      return d[Math.round(deg / 22.5) % 16];
    }

    const DAY_KO = ['일', '월', '화', '수', '목', '금', '토'];
    function dayLabel(str, i) {
      if (i === 0) return '오늘';
      if (i === 1) return '내일';
      return DAY_KO[new Date(str).getDay()] + '요일';
    }

    async function reverseGeo(lat, lon) {
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ko`);
        const d = await r.json();
        const a = d.address || {};
        return [a.city || a.town || a.village || a.county, a.state].filter(Boolean).join(', ') || `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
      } catch { return `${lat.toFixed(2)}, ${lon.toFixed(2)}`; }
    }

    /* ═══════════ State helpers ═══════════ */
    const $ = id => document.getElementById(id);

    function showOnly(id) {
      ['loading', 'error', 'weather'].forEach(k => {
        $(k).style.display = k === id ? (k === 'weather' ? 'block' : 'flex') : 'none';
      });
    }

    /* ═══════════ Init ═══════════ */
    async function init() {
      showOnly('loading');
      try {
        const pos = await new Promise((ok, no) =>
          navigator.geolocation.getCurrentPosition(ok, no, {
            enableHighAccuracy: true, timeout: 15000, maximumAge: 60000,
          })
        );
        const { latitude: lat, longitude: lon } = pos.coords;

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
          + `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,precipitation`
          + `&hourly=temperature_2m,weather_code,precipitation_probability`
          + `&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,precipitation_probability_max`
          + `&timezone=auto&forecast_days=7`;

        const [weather, loc] = await Promise.all([
          fetch(url).then(r => r.json()),
          reverseGeo(lat, lon),
        ]);

        render(weather, loc, lat, lon);
      } catch (e) {
        $('error-msg').textContent =
          e.code === 1 ? '위치 접근이 거부되었습니다. 브라우저 설정에서 위치 권한을 허용해 주세요.' :
            e.code === 2 ? '위치 정보를 사용할 수 없습니다.' :
              e.code === 3 ? '위치 요청 시간이 초과되었습니다.' :
                `오류: ${e.message || '알 수 없는 오류'}`;
        showOnly('error');
      }
    }

    /* ═══════════ Map (OpenStreetMap + Leaflet) ═══════════ */
    let mapInstance = null;
    let markerInstance = null;

    function renderMap(lat, lon, locName) {
      const mapEl = $('map');
      if (!mapEl || typeof L === 'undefined') return;

      const pinIcon = L.divIcon({
        className: 'custom-pin',
        html: '<div class="map-marker"></div>',
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });

      if (!mapInstance) {
        mapInstance = L.map('map', {
          center: [lat, lon],
          zoom: 13,
          zoomControl: true,
          scrollWheelZoom: false
        });

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(mapInstance);

        markerInstance = L.marker([lat, lon], { icon: pinIcon })
          .addTo(mapInstance)
          .bindPopup(`<strong style="font-size:0.82rem;font-family:sans-serif;">${locName}</strong>`);
      } else {
        mapInstance.setView([lat, lon], 13);
        if (markerInstance) {
          markerInstance.setLatLng([lat, lon]).setPopupContent(`<strong style="font-size:0.82rem;font-family:sans-serif;">${locName}</strong>`);
        }
      }

      setTimeout(() => {
        mapInstance.invalidateSize();
      }, 120);
    }

    /* ═══════════ Render ═══════════ */
    function render(data, locName, lat, lon) {
      const c = data.current;
      const h = data.hourly;
      const d = data.daily;
      const now = new Date();
      const hr = now.getHours();

      // Header
      $('loc').textContent = locName;
      $('time').textContent = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

      // Current
      $('cur-icon').innerHTML = weatherSVG(c.weather_code, hr);
      $('cur-temp').innerHTML = `${Math.round(c.temperature_2m)}<span>°</span>`;

      const meta = [];
      meta.push(wmo(c.weather_code).name);
      meta.push(`체감 ${Math.round(c.apparent_temperature)}°`);
      if (d.temperature_2m_max) meta.push(`최고 ${Math.round(d.temperature_2m_max[0])}° / 최저 ${Math.round(d.temperature_2m_min[0])}°`);
      $('cur-meta').innerHTML = meta.join('<span class="sep"> · </span>');

      // Details
      const details = [
        { label: '습도', value: `${c.relative_humidity_2m}%` },
        { label: '바람', value: `${c.wind_speed_10m} km/h ${windDir(c.wind_direction_10m)}` },
        { label: '기압', value: `${Math.round(c.surface_pressure)} hPa` },
        { label: '강수량', value: `${c.precipitation} mm` },
        { label: 'UV', value: d.uv_index_max ? String(d.uv_index_max[0]) : '—' },
        { label: '강수 확률', value: d.precipitation_probability_max ? `${d.precipitation_probability_max[0]}%` : '—' },
      ];
      $('detail-grid').innerHTML = details.map(d =>
        `<div class="detail-item"><div class="d-label">${d.label}</div><div class="d-value">${d.value}</div></div>`
      ).join('');

      // Hourly
      const nowISO = now.toISOString().slice(0, 13);
      let si = h.time.findIndex(t => t.startsWith(nowISO));
      if (si === -1) si = 0;

      $('hourly').innerHTML = '';
      for (let i = si; i < Math.min(si + 24, h.time.length); i++) {
        const t = new Date(h.time[i]);
        const hh = t.getHours();
        const isNow = i === si;
        const el = document.createElement('div');
        el.className = `h-item${isNow ? ' h-now' : ''}`;
        el.innerHTML = `
      <span class="h-time">${isNow ? '지금' : `${hh}시`}</span>
      <span class="h-icon">${weatherSVG(h.weather_code[i], hh)}</span>
      <span class="h-temp">${Math.round(h.temperature_2m[i])}°</span>
    `;
        $('hourly').appendChild(el);
      }

      // Daily
      const allMin = Math.min(...d.temperature_2m_min);
      const allMax = Math.max(...d.temperature_2m_max);
      const range = allMax - allMin || 1;

      $('daily').innerHTML = '';
      for (let i = 0; i < d.time.length; i++) {
        const lo = d.temperature_2m_min[i];
        const hi = d.temperature_2m_max[i];
        const left = ((lo - allMin) / range * 100).toFixed(1);
        const width = (((hi - lo) / range) * 100).toFixed(1);

        const el = document.createElement('div');
        el.className = 'd-row';
        el.innerHTML = `
      <span class="d-day">${dayLabel(d.time[i], i)}</span>
      <span class="d-day-icon">${weatherSVG(d.weather_code[i], 12)}</span>
      <div class="d-range">
        <span class="lo">${Math.round(lo)}°</span>
        <span class="bar"><span class="bar-fill" style="left:${left}%;width:${width}%"></span></span>
        <span class="hi">${Math.round(hi)}°</span>
      </div>
    `;
        $('daily').appendChild(el);
      }

      $('updated').textContent = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      showOnly('weather');
      renderMap(lat, lon, locName);
    }

    /* Auto-refresh */
    setInterval(init, 10 * 60 * 1000);
    init();
  </script>
</body>

</html>
